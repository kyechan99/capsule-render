              </linearGradient>
            </defs>
        
      <g >
        <g transform="translate(427 100)">
          <circle cx="0" cy="0" r="56.00000000000001" fill="url(#linear)" opacity="0.08">
            <animate attributeName="r" values="47.6;61.600000000000016;47.6" dur="4.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.05;0.12;0.05" dur="4.5s" repeatCount="indefinite" />
          </circle>
          <circle cx="0" cy="0" r="32" fill="url(#linear)" opacity="0.28">
