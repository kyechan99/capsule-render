<svg
  width="854"
  height="200"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 200"
>
  <style>
      .text {   font-size: 70px;   font-weight: 700;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  } .desc {   font-size: 20px;   font-weight: 500;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  } 
      .text, .desc {   animation: fadeIn 1.2s ease-in-out forwards;  } @keyframes fadeIn {   from {     opacity: 0;   }   to {     opacity: 1;   }  } 
    </style>
  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f9beb" />
      <stop offset="100%" stop-color="#816bf2" />
    </linearGradient>
  </defs>

  <defs>
    <linearGradient id="checkeredLinear" x1="0%" y1="0%" x2="100%" y2="0%"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8f9beb" />
      <stop offset="100%" stop-color="#816bf2" />
    </linearGradient>
    <pattern
      id="checkeredPattern"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <rect width="40" height="40" fill="none" shape-rendering="crispEdges" />

      <rect x="0" y="0" width="20" height="20" fill="#ffffff" opacity="0.06">
        <animate
          attributeName="opacity"
          values="0.041999999999999996;0.06;0.06899999999999999;0.06;0.041999999999999996"
          keyTimes="0;0.2;0.5;0.8;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          calcMode="spline"
          dur="16s"
          begin="0s"
          repeatCount="indefinite"
        />
      </rect>
      <rect x="20" y="0" width="20" height="20" fill="#000000" opacity="0.05">
        <animate
          attributeName="opacity"
          values="0.034999999999999996;0.05;0.057499999999999996;0.05;0.034999999999999996"
          keyTimes="0;0.2;0.5;0.8;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          calcMode="spline"
          dur="16s"
          begin="2s"
          repeatCount="indefinite"
        />
      </rect>
      <rect x="0" y="20" width="20" height="20" fill="#000000" opacity="0.05">
        <animate
          attributeName="opacity"
          values="0.034999999999999996;0.05;0.057499999999999996;0.05;0.034999999999999996"
          keyTimes="0;0.2;0.5;0.8;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          calcMode="spline"
          dur="16s"
          begin="4s"
          repeatCount="indefinite"
        />
      </rect>
      <rect x="20" y="20" width="20" height="20" fill="#ffffff" opacity="0.06">
        <animate
          attributeName="opacity"
          values="0.041999999999999996;0.06;0.06899999999999999;0.06;0.041999999999999996"
          keyTimes="0;0.2;0.5;0.8;1"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
          calcMode="spline"
          dur="16s"
          begin="6s"
          repeatCount="indefinite"
        />
      </rect>
    </pattern>
  </defs>
  <g>
    <rect width="100%" height="100%" fill="url(#checkeredLinear)" />
    <rect width="100%" height="100%" fill="url(#checkeredPattern)" />
  </g>
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="50%" class="text"
    style="fill:#f7f5f5;" stroke="#none" stroke-width="1">Checkered</text>

</svg>
    